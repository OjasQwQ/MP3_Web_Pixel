<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width= device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/641f42e033.js" crossorigin="anonymous"></script>
    
    </head>
    <body>
        <div id="music_player">
            <img id="song_image" src="Assets/love-you-to-death-type-o-negative-inspired-record.svg"/>
            <div id="song_name">Song</div>
            <div id="song_artist">Artist</div>

            <input id="slider_song" type="range" >

            <div id= "music_buttons" >
                <i id="shuffle_song" class="fa-solid fa-shuffle"></i>
                <i id="prev_song" class="fa-solid fa-backward-step fa-2x"></i>
                <i id="playpause_song" class="fa-solid fa-circle-play fa-3x"></i>
                <i id="next_song" class="fa-solid fa-forward-step fa-2x"></i>
                <i id="repeat_song" class="fa-solid fa-repeat"></i>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
