<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/641f42e033.js" crossorigin="anonymous"></script>

    </head>
    <body class="background">

        <svg width="0" height="0">
            <filter id="flt">
                <feTurbulence type="fractalNoise" baseFrequency=""></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="n" scale=""></feDisplacementMap>
            </filter>
        </svg>


        <div class="player_layout">
            <div id="music_player">
                <img id="song_image" src="Assets/love-you-to-death-type-o-negative-inspired-record.svg">
                <div id="song_name">Song</div>
                <div id="song_artist">Artist</div>

                <input id="slider_song" type="range" min="0" value="0" step="0.1" >

                <div id="music_buttons">
                    <button id="shuffle_song" type="button"><i class="fa-solid fa-shuffle"></i></button>
                    <button id="prev_song" type="button" ><i class="fa-solid fa-backward-step fa-2x"></i></button>
                    <button id="playpause_song" type="button" ><i class="fa-solid fa-circle-play fa-3x"></i></button>
                    <button id="next_song" type="button" ><i class="fa-solid fa-forward-step fa-2x"></i></button>
                    <button id="repeat_song" type="button" ><i class="fa-solid fa-repeat"></i></button>
                </div>
            </div>

            <div class="playlist">

                <div class="playlist_heading">
                    <h2 id="playlist_title">Playlist: </h2>
                    <button class="add_music" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="10" fill="black" />
                            <path d="M12 7V17M7 12H17" stroke="white" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                    <input id="audio_files" type="file" accept="audio/*" multiple hidden>
                </div>

                <div id="playlist_items"></div>
            </div>

        </div>
        <script src="script.js"></script>
    </body>
</html>
